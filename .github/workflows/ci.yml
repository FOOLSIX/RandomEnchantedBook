name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Java 21
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Test release validation
        run: python3 -B -m unittest discover -s .github/scripts/tests -v

      - name: Read version and changelog
        id: metadata
        run: python3 -B .github/scripts/release_metadata.py

      - name: Generate resources
        run: bash ./gradlew --no-daemon runData

      - name: Check generated resources are committed
        run: python3 -B .github/scripts/release_metadata.py --check-generated

      - name: Build
        run: bash ./gradlew --no-daemon build

      - name: Verify release JAR
        run: python3 -B .github/scripts/release_metadata.py --check-jar

      - name: Save build artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: random-enchanted-book-${{ steps.metadata.outputs.version }}
          path: |
            ${{ steps.metadata.outputs.artifact }}
            ${{ steps.metadata.outputs.changelog }}
          if-no-files-found: error
          retention-days: 14
