name: Publish to CurseForge

on:
  push:
    branches: [main]
    paths: [gradle.properties]
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch, tag, or commit to build'
        required: true
        default: main
        type: string
      release_type:
        description: CurseForge release type
        required: true
        default: release
        type: choice
        options: [release, beta, alpha]
      publish:
        description: 'Upload to CurseForge (leave unchecked for a dry run)'
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  detect:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      publish: ${{ steps.version.outputs.publish }}
    steps:
      - name: Checkout push history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Detect mod_version change
        if: github.event_name == 'push'
        id: version
        run: python3 -B .github/scripts/release_metadata.py --detect-version-change

  release:
    needs: detect
    if: needs.detect.outputs.publish == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    concurrency:
      group: curseforge-${{ github.event_name == 'push' && github.sha || inputs.ref }}
      cancel-in-progress: false
    env:
      RELEASE_TYPE: ${{ inputs.release_type || 'release' }}
    steps:
      - name: Checkout release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'push' && github.sha || inputs.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Java 21
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Test release validation
        run: python3 -B -m unittest discover -s .github/scripts/tests -v

      - name: Validate version and changelog
        id: metadata
        run: python3 -B .github/scripts/release_metadata.py

      - name: Check CurseForge token
        if: github.event_name == 'push' || inputs.publish
        env:
          CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
        run: |
          if [ -z "$CURSEFORGE_TOKEN" ]; then
            echo '::error::Set the CURSEFORGE_TOKEN repository secret before publishing.'
            exit 1
          fi

      - name: Generate resources
        run: bash ./gradlew --no-daemon runData

      - name: Check generated resources are committed
        run: python3 -B .github/scripts/release_metadata.py --check-generated

      - name: Build
        run: bash ./gradlew --no-daemon build

      - name: Verify release JAR
        run: python3 -B .github/scripts/release_metadata.py --check-jar

      - name: Save release artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: random-enchanted-book-${{ steps.metadata.outputs.version }}-release
          path: |
            ${{ steps.metadata.outputs.artifact }}
            ${{ steps.metadata.outputs.changelog }}
          if-no-files-found: error
          retention-days: 30

      - name: Upload to CurseForge
        id: publish
        if: github.event_name == 'push' || inputs.publish
        uses: Kira-NT/mc-publish@52307b03863581dec6b652b83e597aec02ebb075 # v3.3.1
        with:
          curseforge-id: '1807725'
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          files: ${{ steps.metadata.outputs.artifact }}
          name: ${{ steps.metadata.outputs.display_name }}
          version: ${{ steps.metadata.outputs.version }}
          version-type: ${{ steps.metadata.outputs.release_type }}
          changelog-file: ${{ steps.metadata.outputs.changelog }}
          loaders: neoforge
          environment: client | server
          game-versions: ${{ steps.metadata.outputs.minecraft_version }}
          java: '21'
          dependencies: jei(optional)
          fail-mode: fail

      - name: Report uploaded file
        if: steps.publish.outcome == 'success'
        env:
          CURSEFORGE_URL: ${{ steps.publish.outputs.curseforge-url }}
        run: |
          printf 'Uploaded to CurseForge: %s\n' "$CURSEFORGE_URL" >> "$GITHUB_STEP_SUMMARY"

      - name: Report dry run
        if: github.event_name == 'workflow_dispatch' && !inputs.publish
        run: |
          printf '%s\n' 'Dry run completed. No files were published.' >> "$GITHUB_STEP_SUMMARY"
